# モジュール 4: Environments と保護ルール
#
# 見どころ:
#   - environment を指定するとゲート（承認待ち・待機時間・ブランチ制限）がかかる
#   - シークレットを環境ごとに分けられる
#   - 承認者は最大 6 名（ユーザー / チーム）
#
# 事前準備（リポジトリ設定 → Environments）:
#   1. staging を作る（保護ルールなし）
#   2. production を作る
#      - Required reviewers に自分を追加
#      - Deployment branches を "Selected branches" にして main のみ許可
name: 24 - Deploy with Environments

on:
  workflow_dispatch:
    inputs:
      version:
        description: デプロイするバージョン
        type: string
        default: "1.0.0"

permissions:
  contents: read

# 本番デプロイは並行させない。ただし進行中のデプロイはキャンセルしない。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-project
      - name: ビルド
        env:
          APP_VERSION: ${{ inputs.version }}
        run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ inputs.version }}
          path: dist/
          retention-days: 7

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.example.com
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ inputs.version }}
          path: dist
      - name: デプロイ（模擬）
        run: |
          echo "staging に ${{ inputs.version }} をデプロイ"
          cat dist/default.json

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    # ここで承認待ちになる（Required reviewers を設定した場合）
    environment:
      name: production
      url: https://example.com
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ inputs.version }}
          path: dist
      - name: デプロイ（模擬）
        run: |
          echo "production に ${{ inputs.version }} をデプロイ"
          echo "承認者: 誰が承認したかはデプロイ履歴と監査ログに残る"
