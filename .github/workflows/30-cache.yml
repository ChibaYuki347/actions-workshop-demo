# モジュール 5: キャッシュ
#
# 見どころ:
#   - key はロックファイルのハッシュを含める（内容が変われば別キャッシュ）
#   - restore-keys で前方一致フォールバック
#   - setup-* 系の内蔵キャッシュで済むならそちらを使う（設定ミスが減る）
#
# 落とし穴:
#   - キャッシュのスコープはブランチ単位。あるブランチから読めるのは
#     そのブランチ自身・その子ブランチ・デフォルトブランチのキャッシュだけ。
#     → 「main で温めて全 PR で使う」が正しい戦略。feature ブランチ同士では共有されない。
#   - 既定はリポジトリあたり 10 GB / 7 日間未アクセスで削除。
#     どちらも Enterprise → Organization → Repository の階層ポリシーで変更できる
#     （上位から順に設定する必要があり、最も小さい値が適用される）。
#   - キャッシュに機密を入れない。デフォルトブランチのキャッシュはフォークからも読める。
#
# 棚卸し: gh extension install actions/gh-actions-cache
name: 30 - Cache

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # 推奨: setup-* の内蔵キャッシュを使う
  builtin-cache:
    name: 内蔵キャッシュ（推奨）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm # これだけで npm のキャッシュが効く
      - run: npm ci
      - run: npm test

  # 自前でキャッシュを制御したい場合
  manual-cache:
    name: 明示的なキャッシュ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ~/.npm
          # ロックファイルが変われば別のキャッシュになる
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          # 完全一致しなくても、前方一致で近いものを再利用する
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: ヒットしたか
        run: echo "cache-hit = ${{ steps.cache.outputs.cache-hit }}"

      - run: npm ci
      - run: npm test

  # ビルド成果物をジョブ間で引き回す（キャッシュではなくアーティファクト）
  artifact-handoff:
    name: アーティファクトで受け渡し
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-project
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: dist/
          retention-days: 3 # 既定の 90 日は長すぎることが多い
