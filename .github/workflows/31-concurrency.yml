# モジュール 5: concurrency
#
# 見どころ:
#   - group が同じ実行は同時に 1 つしか走らない
#   - cancel-in-progress の使い分けがすべて
#       CI（PR）        : true  → 古い実行を止めて無駄を削る
#       デプロイ（本番）: false → 進行中のデプロイは絶対に止めない
name: 31 - Concurrency

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

# PR ごとにグループを作り、新しい push が来たら古い実行をキャンセルする。
# 連続 push が多いチームほど効果が大きい（無駄実行を丸ごと削減できる）。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  slow-check:
    runs-on: ubuntu-latest
    steps:
      - name: 時間のかかる処理（模擬）
        run: |
          echo "開始: $(date --iso-8601=seconds)"
          for i in $(seq 1 12); do
            echo "処理中... ${i}/12"
            sleep 5
          done
          echo "完了: $(date --iso-8601=seconds)"

      - name: 試し方
        run: |
          echo "この実行中に同じ PR へもう一度 push すると、"
          echo "この実行がキャンセルされて新しい実行だけが残る。"
