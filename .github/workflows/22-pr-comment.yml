# モジュール 4: フォーク PR を安全に扱う（その 2・書き込み側）
#
# 見どころ:
#   - workflow_run は「デフォルトブランチの定義」で「信頼された権限」で動く
#   - フォークのコードは一切実行しない。前段が残したデータだけを読む。
#   - これが pull_request_target の代わりに使うべき安全なパターン。
#
# なぜ pull_request_target を避けるか:
#   pull_request_target は「書き込み権限のあるトークン」と「シークレット」を持った状態で動く。
#   ここで PR のコードを checkout して実行すると、フォークの任意コードが
#   フルの権限で動いてしまう（リポジトリ乗っ取りに直結する典型的な事故）。
name: 22 - PR Comment (workflow_run)

on:
  workflow_run:
    workflows: ["21 - PR Safe (build)"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write # ここでだけ書き込みを許す

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      # 重要: PR のコードは checkout しない。アーティファクトだけを取る。
      - name: 前段のアーティファクトを取得
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pr-result
          path: pr-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: PR 番号を読む
        id: meta
        run: |
          # 外部入力なので、必ず検証してから使う
          pr=$(cat pr-result/pr-number.txt | tr -d '[:space:]')
          if ! echo "$pr" | grep -Eq '^[0-9]+$'; then
            echo "不正な PR 番号: $pr"
            exit 1
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "status=$(cat pr-result/status.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: コメントする
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.meta.outputs.pr }}
          STATUS: ${{ steps.meta.outputs.status }}
        run: |
          gh pr comment "$PR" \
            --repo "$GITHUB_REPOSITORY" \
            --body "ビルド結果: ${STATUS}（[ログ](${{ github.event.workflow_run.html_url }})）"
