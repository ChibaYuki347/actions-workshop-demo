name: 00 環境確認

# 演習を始める前に、これを 1 回だけ手動で実行します。
# 「実行環境がちゃんと使えるか」を確かめるためのワークフローです。
# push では動かないので、演習の邪魔にはなりません。
on:
  workflow_dispatch:

jobs:
  canary:
    # ▼▼▼ 当日、この 1 行だけ書き換えます ▼▼▼
    runs-on: [self-hosted, Windows, X64]   # RUNS_ON_MARKER
    # ▲▲▲ ここまで ▲▲▲

    steps:
      - name: 1. 作業フォルダの状態（checkout する前）
        # セルフホステッドランナーは作業フォルダを使い回します。
        # ここに前回のファイルが残っている場合、演習が意図どおりに動かないことがあります。
        # 何も表示されなければ、まっさらな状態です。
        run: |
          echo "workspace = ${{ github.workspace }}"
          ls

      - name: 2. リポジトリを取得できるか
        uses: actions/checkout@v5

      - name: 3. 実行環境の素性
        run: |
          echo "os     = ${{ runner.os }}"
          echo "arch   = ${{ runner.arch }}"
          echo "runner = ${{ runner.name }}"

      - name: 4. ファイルが読めるか
        run: cat README.md

      - name: 5. ファイル一覧が見られるか
        run: ls

      - name: 6. 既定のシェルは何か
        # 演習に必須ではありません。結果を知りたいだけなので、
        # 失敗しても後続のステップを止めない設定にしています。
        continue-on-error: true
        run: $PSVersionTable.PSVersion.ToString()

      - name: 7. bash が使えるか
        # 使えなくても演習は問題なくできます。
        continue-on-error: true
        shell: bash
        run: echo "bash is available"

      - name: 8. ログの日本語表示（参考）
        # 下の行が文字化けする環境では、run: の中に日本語を書かないでください。
        # 日本語はステップ名（name:）に書けば、正しく表示されます。
        # 演習用のコードは日本語を出力しないので、影響はありません。
        continue-on-error: true
        run: echo "Japanese test / 日本語テスト"
