# ハンズオン③ で使うコード
# 手順書 第 3 章「手順 3-1」で、この中身に置き換えます。
#
# Day 1 との違いは 3 つです。
#   1. pull_request: を足した      → PR が作られたときにも動く（今回の主役）
#   2. push に branches を足した   → main への push のときだけ動く
#   3. テストの代わりになる判定を足した

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    # ▼▼▼ 当日、この 1 行だけ書き換えます ▼▼▼
    runs-on: [self-hosted, Windows, X64]   # RUNS_ON_MARKER
    # ▲▲▲ ここまで ▲▲▲
    steps:
      - uses: actions/checkout@v5
      - name: あいさつを表示する
        run: echo "Hello GitHub Actions"
      - run: ls
      - name: テストの代わり
        # 本物のプロジェクトなら、ここが npm test や pytest になります。
        # 今日は「README.md が読めるか」をテストの代わりにしています。
        # ファイルが無ければ、このステップは失敗します。
        run: cat README.md
