# 🔍 演習: このワークフローには問題が 7 つあります
#
# 進め方:
#   1. 5 分で、気づいた問題をできるだけ書き出す
#   2. ペアで突き合わせる
#   3. SOLUTIONS.md で答え合わせ
#
# ヒント: セキュリティ / コスト / 再現性 の 3 観点で見る
#         （内訳は セキュリティ 5 / コスト 1 / 再現性 1。偏りにも意味があります）
#
# ⚠️ 意図的に危険な書き方をしたファイルです。
#    .github/workflows/ の外に置いてあるので実行されることはありませんが、
#    ここに出てくるパターンを本番のワークフローにコピーしないでください。
name: 99 - Broken (演習用)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@main
        with:
          node-version: 22

      - name: 依存関係のインストール
        run: npm install

      - name: PR タイトルをログに出す
        run: echo "building PR ${{ github.event.pull_request.title }}"

      - name: テスト
        run: npm test

      - name: デプロイ
        run: |
          echo "deploying with token ${{ secrets.DEPLOY_TOKEN }}"
          ./scripts/deploy.sh --token "${{ secrets.DEPLOY_TOKEN }}"

      - uses: some-random-user/cool-action@v1
        with:
          path: dist/

      - name: 通知
        run: curl -X POST https://hooks.example.com/notify -d "done"
