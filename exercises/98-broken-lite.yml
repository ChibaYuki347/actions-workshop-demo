# 🔍 演習（やさしい版）: このワークフローには問題が 3 つあります
#
# 進め方:
#   1. 3 分で、気になったところを挙げてみる
#   2. 「これ、本番で動かして大丈夫かな？」という目で見る
#   3. SOLUTIONS.md で答え合わせ
#
# ヒント: セキュリティ 2 / 再現性 1 です。
#
# ⚠️ 意図的に危険な書き方をしたファイルです。
#    .github/workflows/ の外に置いてあるので実行されることはありませんが、
#    ここに出てくるパターンを本番のワークフローにコピーしないでください。
#
# もっと難しい版が欲しい方は 99-broken.yml（問題 7 つ）へどうぞ。
name: 98 - Broken Lite (演習用・やさしい版)

on:
  push:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@main
        with:
          node-version: 22

      - name: ビルド
        run: npm ci && npm run build

      - name: デプロイ
        run: |
          echo "deploying with key ${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws s3 sync ./dist s3://my-bucket/
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
